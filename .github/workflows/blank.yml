name: Changelog

on:
  push:
    branches: [main]

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar changelog
        run: |
          echo "## Ultimas alteracoes"
          git log -10 --pretty=format:"- %s (%an, %ad)" --date=short
        