name: Release Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Zipar repositorio
        run: git archive --format=zip --output="pacote-${{ github.ref_name }}.zip" HEAD

      - name: Criar release e anexar o zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "pacote-${{ github.ref_name }}.zip" \
            --title "Versao ${{ github.ref_name }}" \
            --generate-notes